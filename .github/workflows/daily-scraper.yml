name: Daily Idol Product Sync

on:
  schedule:
    # Runs 5 times daily at 01:23, 05:23, 09:23, 19:23, and 23:23 UTC
    - cron: '23 1,5,9,19,23 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    env:
      PYTHONUNBUFFERED: "1"
      DISCORD_RELEASE_WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 playwright

      - name: Install Playwright Chromium Only
        run: |
          playwright install --with-deps chromium

      - name: Run Idol Catalog Scraper
        run: |
          python -u scraper.py

      - name: Run Unified Build Pipeline
        run: |
          python build_catalog.py

      - name: Ping Search Engines for Rapid Indexing
        run: |
          python ping_search_engines.py

      - name: Broadcast New Releases to Community Webhook
        run: |
          python notify_releases.py

      - name: Commit and Push Updated Catalog & Sitemap
        run: |
          git config --global user.name "IdolJapan Bot"
          git config --global user.email "bot@idoljapan.store"
          git add products.json catalog-index.json schema-catalog.json sitemap.xml feed.xml scraper_state.json rates.json search_aliases.json sw.js promotions.json groups/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update idol catalog, landing pages & sitemap [skip ci]" && git push)
