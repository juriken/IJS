  <!-- Early Theme Detection -->

<body class="bg-[#faf7f5] dark:bg-[#12131a] text-[#2c2527] dark:text-[#e8e6f0] font-sans antialiased min-h-screen flex flex-col transition-colors duration-200">

    <div class="max-w-7xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-3">
      <div class="flex items-center space-x-2">
        <i class="fa-solid fa-compact-disc text-amber-200 dark:text-[#f47293] text-2xl"></i>
        <a href="/" class="text-xl sm:text-2xl font-black tracking-tight text-white">IdolJapan<span class="text-pink-100 dark:text-[#f47293]">.store</span></a>
      </div>
      
      <!-- Search -->
      <div class="flex-1 min-w-[220px] max-w-md relative order-3 sm:order-2 w-full sm:w-auto">
        <input 
          id="search-input" 
          type="text" 
          placeholder="Search Morning Musume, Nogizaka46, CD, Blu-ray..." 
          class="w-full pl-10 pr-4 py-2 rounded-full text-[#2c2527] dark:text-[#e8e6f0] bg-white/95 dark:bg-[#25283a] placeholder-[#8c7e82] dark:placeholder-[#7e8299] focus:outline-none focus:ring-2 focus:ring-[#f47293] text-sm shadow-inner border border-transparent dark:border-slate-700/60"

      </div>

      <div class="flex items-center gap-2 order-2 sm:order-3">

        <div class="relative flex items-center bg-[#cc4466] dark:bg-[#25283a] hover:bg-[#b83858] dark:hover:bg-[#2e3247] rounded-full px-2.5 py-1 border border-white/20 dark:border-slate-700 shadow-sm text-xs font-bold transition">
          <i class="fa-solid fa-coins text-amber-200 dark:text-[#f47293] mr-1.5 text-xs"></i>
          <select 
            id="currency-select" 
            onchange="onCurrencyChange(this.value)" 
            class="bg-transparent text-white font-bold focus:outline-none cursor-pointer pr-1 py-0.5"
            aria-label="Select Currency"
          >
            <optgroup label="Popular">
              <option value="JPY" class="text-slate-900 bg-white" selected>JPY (¥)</option>
              <option value="USD" class="text-slate-900 bg-white">USD ($)</option>
              <option value="EUR" class="text-slate-900 bg-white">EUR (€)</option>
              <option value="GBP" class="text-slate-900 bg-white">GBP (£)</option>
              <option value="CAD" class="text-slate-900 bg-white">CAD ($)</option>
              <option value="AUD" class="text-slate-900 bg-white">AUD ($)</option>
              <option value="TWD" class="text-slate-900 bg-white">TWD (NT$)</option>
              <option value="HKD" class="text-slate-900 bg-white">HKD (HK$)</option>
              <option value="KRW" class="text-slate-900 bg-white">KRW (₩)</option>
              <option value="SGD" class="text-slate-900 bg-white">SGD ($)</option>
            </optgroup>
            <optgroup id="all-currencies-group" label="All Currencies"></optgroup>
          </select>
        </div>

          <i id="theme-icon" class="fa-solid fa-moon text-pink-100 dark:text-[#f47293]"></i>
        </button>

        <!-- X Link -->

          href="https://x.com/IdolJapanStore"

          class="bg-[#cc4466] dark:bg-[#25283a] hover:bg-[#b83858] dark:hover:bg-[#2e3247] text-xs font-bold w-8 h-8 rounded-full border border-white/20 dark:border-slate-700 transition flex items-center justify-center shadow-sm text-pink-100 dark:text-[#f47293] hover:text-white"
        >
          <i class="fa-brands fa-x-twitter text-sm"></i>
        </a>
      </div>
