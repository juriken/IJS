name: Scheduled Alternate Idol Sync

on:
  schedule:
    # Runs every day at 15:00 UTC (00:00 JST midnight Tokyo)
    # Automatically alternates targets by day of week:
    # Mon/Wed/Fri: Hello! Project & Up-Front Alumni
    # Tue/Thu/Sat: AKB48 Group & Sakamichi Series
    # Sun: Stardust Planet, =LOVE, KAWAII LAB., Modern & Alternative
    - cron: '0 15 * * *'
  workflow_dispatch:
    inputs:
      schedule_override:
        description: 'Choose schedule shard or scrape all:'
        required: true
        default: 'alternate'
        type: choice
        options:
          - 'alternate'
          - 'mon-fri (H!P Active & Flagship)'
          - 'wed (H!P Graduates & Alumni)'
          - 'tue-thu-sat (AKB48 & Sakamichi)'
          - 'sun (Stardust, =LOVE, KAWAII LAB., Modern)'
          - 'all groups'
      test_artist:
        description: 'Optional: Isolate a single test group (overrides schedule):'
        required: true
        default: 'none (use schedule above)'
        type: choice
        options:
          - 'none (use schedule above)'
          - 'Morning Musume'
          - 'ANGERME'
          - 'AKB48'
          - 'Nogizaka46'
          - 'Sakurazaka46'
          - 'Momoiro Clover Z'
          - '=LOVE'
          - 'FRUITS ZIPPER'
          - 'BABYMETAL'
      page_depth:
        description: 'Max pages per query (use 1 for fast smoke tests):'
        required: true
        default: 'default'
        type: choice
        options:
          - 'default'
          - '1'
          - '3'
          - '10'

concurrency:
  group: catalog-pipeline-lock
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scrape-and-update-scheduled:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      PYTHONUNBUFFERED: "1"
      DISCORD_RELEASE_WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python with Pip Cache
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Get Installed Playwright Version
        id: pw-version
        run: echo "version=$(python -c 'import importlib.metadata; print(importlib.metadata.version("playwright"))')" >> $GITHUB_OUTPUT

      - name: Cache Playwright Chromium Binaries
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.pw-version.outputs.version }}-${{ hashFiles('requirements.txt') }}

      - name: Install Playwright Chromium & OS Dependencies
        run: |
          playwright install --with-deps chromium

      - name: Step 1 - Execute Alternate Day Scraper
        env:
          SCHEDULE_MODE: ${{ github.event.inputs.schedule_override || 'alternate' }}
          TARGET_ARTIST: ${{ github.event.inputs.test_artist || 'none (use schedule above)' }}
          PAGES_PER_TARGET: ${{ github.event.inputs.page_depth || 'default' }}
        run: |
          python -u scraper.py

      - name: Step 2 - Clean Catalog & Enforce Member Reclassification
        run: |
          if [ -f clean_catalog.py ]; then
            python -u clean_catalog.py
          fi

      - name: Step 3 - Rebuild Catalog Summary Index
        run: |
          python build_catalog.py || python build_summary.py || true

      - name: Step 4 - Ping Search Engines for Rapid Indexing
        run: |
          if [ -f ping_search_engines.py ]; then
            python ping_search_engines.py
          fi

      - name: Step 5 - Broadcast New Releases to Community Webhook
        run: |
          if [ -f notify_releases.py ]; then
            python notify_releases.py
          fi

      - name: Step 6 - Commit and Push Updated Catalog & Sitemap
        run: |
          git config --global user.name "IdolJapan Bot"
          git config --global user.email "bot@idoljapan.store"
          git add -A
          if ! git diff --staged --quiet; then
            git commit -m "Automated alternate idol catalog, landing pages & sitemap update"
            git pull --rebase --autostash
            git push
          fi
