name: Daily Idol Product Sync

on:
  schedule:
    # Runs 5 times daily during GitHub off-peak hours at an off-beat minute:
    # 01:23, 05:23, 09:23, 19:23, and 23:23 UTC
    - cron: '23 1,5,9,19,23 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 playwright

      - name: Install Playwright Chromium Only
        run: |
          playwright install --with-deps chromium

      - name: Run Idol Catalog Scraper
        run: |
          python -u scraper.py

      - name: Validate Catalog Integrity
        run: |
          python validate_catalog.py

      - name: Auto-Generate XML Sitemap
        run: |
          python generate_sitemap.py

      - name: Ping Search Engines for Rapid Indexing
        run: |
          python ping_search_engines.py

      - name: Commit and Push Updated Catalog & Sitemap
        run: |
          git config --global user.name "IdolJapan Bot"
          git config --global user.email "bot@idoljapan.store"
          git add products.json catalog-index.json sitemap.xml
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update idol catalog & sitemap [skip ci]" && git push)
