name: Re-sort Up Up Girls Branches

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  resort-uug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Execute Re-sorting Script
        run: |
          python -c '
          import json

          DATA_FILE = "products.json"

          with open(DATA_FILE, "r", encoding="utf-8") as f:
              catalog = json.load(f)

          updated_count = 0
          for pid, item in catalog.items():
              if item.get("artist") == "Up Up Girls":
                  title = item.get("title", "")
                  if "(2)" in title or "（2）" in title:
                      item["artist"] = "Up Up Girls (2)"
                  else:
                      item["artist"] = "Up Up Girls (Kari)"
                  item["category"] = "Up-Front Alumni"
                  updated_count += 1

          with open(DATA_FILE, "w", encoding="utf-8") as f:
              json.dump(catalog, f, indent=2, ensure_ascii=False)

          print(f"Successfully re-sorted {updated_count} items into Up Up Girls (Kari) and Up Up Girls (2).")
          '

      - name: Commit and Push Updated Database
        run: |
          git config --global user.name "IdolJapan Bot"
          git config --global user.email "bot@idoljapan.store"
          git add products.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Re-sort Up Up Girls into (Kari) and (2) branches" && git push)
