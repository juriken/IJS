name: Auto-Heal Catalog Release Dates

on:
  # Automated schedule paused; uncomment below to resume
  # schedule:
  #   - cron: '0 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  heal-dates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install requests beautifulsoup4

      - name: Run Date Healer Batch
        run: |
          python -u repair_catalog_dates.py

      - name: Commit and Push Verified Dates
        run: |
          git config --global user.name "IdolJapan Bot"
          git config --global user.email "bot@idoljapan.store"
          git add products.json repair_progress.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-heal verified CDJapan release dates [skip ci]" && git push)
