name: Targeted Idol Scraper & Catalog Date Healer

on:
  workflow_dispatch:
    inputs:
      action_mode:
        description: 'Action to execute:'
        required: true
        default: 'Scrape Targeted Artist'
        type: choice
        options:
          - 'Scrape Targeted Artist'
          - 'Heal Catalog Release Dates'
          - 'Full Pipeline (Scrape + Heal Dates + Clean)'
      target_artist:
        description: 'Group/Soloist to scrape (if running Scrape):'
        required: true
        default: 'All Groups'
        type: choice
        options:
          - 'All Groups'
