name: Build Static CSS

on:
  push:
    branches:
      - main
    paths:
      - 'public/index.html'
      - 'public/js/**'
      - 'public/css/input.css'
      - 'tailwind.config.js'
  workflow_dispatch:

concurrency:
  group: 'catalog-pipeline-lock'
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-tailwind:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Tailwind CLI
        run: npm install -D tailwindcss@3

      - name: Build Minified CSS
        run: npx tailwindcss -i public/css/input.css -o public/css/tailwind.min.css --minify

      - name: Commit and Push Compiled Stylesheet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/css/tailwind.min.css
          if git diff --staged --quiet; then
            echo "No changes in compiled CSS"
          else
            git commit -m "build: update static tailwind stylesheet"
            git push
          fi
