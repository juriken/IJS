name: Weekly CDJapan Catalog Healthcheck

on:
  schedule:
    # Runs every Sunday at 03:15 UTC
    - cron: '15 3 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-healthcheck:
    runs-on: ubuntu-latest
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Clean & Audit Catalog (Prune Non-Idols & Fix Categories)
        run: |
          python clean_catalog.py

      - name: Run URL & Availability Health Check
        run: |
          python healthcheck.py

      - name: Rebuild Catalog Summary Index
        run: |
          python build_catalog.py || python build_summary.py

      - name: Validate Catalog After Healthcheck
        run: |
          python validate_catalog.py

      - name: Auto-Generate XML Sitemap
        run: |
          python generate_sitemap.py

      - name: Commit and Push Healthcheck Updates
        run: |
          git config --global user.name "IdolJapan Bot"
          git config --global user.email "bot@idoljapan.store"
          git add products.json catalog-index.json sitemap.xml scraper_state.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Weekly healthcheck: purge invalid items, fix categories, and update OOP statuses" && git push)
