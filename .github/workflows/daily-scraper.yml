name: Daily Idol Product Sync

on:
  schedule:
    # Runs automatically every day at 03:00 UTC
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 playwright

      - name: Install Playwright Chromium Only
        run: |
          playwright install --with-deps chromium

      - name: Run Idol Catalog Scraper
        run: |
          python -u repair_catalog_dates.py

      - name: Commit and Push Updated Catalog
        run: |
          git config --global user.name "IdolJapan Bot"
          git config --global user.email "bot@idoljapan.store"
          git add products.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update idol catalog release dates" && git push)
