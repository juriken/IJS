          - 'Rino Sashihara'
          - 'Tomomi Itano'
          - 'Nogizaka46'
          - 'Sakurazaka46'
          - 'Hinatazaka46'
          - '22/7'
          - 'Boku ga Mitakatta Aozora'
          - 'Mai Shiraishi'
          - 'Nanase Nishino'
          - 'Erika Ikuta'
          - 'Asuka Saito'
          - 'Yurina Hirate'
          - 'Momoiro Clover Z'
          - 'Shiritsu Ebisu Chugaku'
          - 'Chou Tokimeki Sendenbu'
          - 'TEAM SHACHI'
          - 'BATTEN GIRLS'
          - 'ukka'
          - '=LOVE'
          - '≠ME'
          - '≒JOY'
          - 'KAWAII LAB.'
          - 'FRUITS ZIPPER'
          - 'CANDY TUNE'
          - 'SWEET STEADY'
          - 'CUTIE STREET'
          - 'Modern Idols'
          - 'NiziU'
          - 'ME:I'
          - 'IS:SUE'
          - 'BABYMETAL'
          - 'Sakura Gakuin'
          - '@onefive'
          - 'All Groups'

permissions:
  contents: write

jobs:
  test-scrape:
    runs-on: ubuntu-latest
    env:
      PYTHONUNBUFFERED: "1"
      TARGET_ARTIST: ${{ github.event.inputs.target_group }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 playwright

      - name: Install Playwright Chromium Only
        run: |
          playwright install --with-deps chromium

      - name: Run Targeted Scraper
        run: |
          python -u scraper.py

      - name: Rebuild Catalog Summary Index
        run: |
          python build_summary.py

      - name: Validate Scraped Integrity
        run: |
          python validate_catalog.py

      - name: Commit and Push Verified Changes
        run: |
          git config --global user.name "IdolJapan Bot"
          git config --global user.email "bot@idoljapan.store"
          git add products.json catalog-index.json scraper_state.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Test scrape: ${{ github.event.inputs.target_group }} [skip ci]" && git push)
