name: Daily Idol Product Sync

on:
  schedule:
    # Runs daily at 03:00 UTC (12:00 PM JST)
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-catalog:
    runs-on: ubuntu-latest
    env:
      PYTHONUNBUFFERED: "1"
      TARGET_ARTIST: "All Groups"
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 playwright

      - name: Install Playwright Chromium Only
        run: |
          playwright install --with-deps chromium

      - name: Run Scraper
        run: |
          python -u scraper.py

      - name: Rebuild Catalog Summary Index
        run: |
          python build_summary.py

      - name: Validate Catalog Integrity
        run: |
          python validate_catalog.py

      - name: Commit and Push Verified Changes
        run: |
          git config --global user.name "IdolJapan Bot"
          git config --global user.email "bot@idoljapan.store"
          git add products.json catalog-index.json scraper_state.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Automated Daily Product Sync" && git push)
