          - 'no3b'
          - 'French Kiss'
          - 'Watarirouka Hashiritai'
          - 'Sayaka Yamamoto'
          - 'Atsuko Maeda'
          - 'Yuko Oshima'
          - 'Mayu Watanabe'
          - 'Yuki Kashiwagi'
          - 'Rino Sashihara'
          - 'Tomomi Itano'
          - 'Nogizaka46'
          - 'Sakurazaka46'
          - 'Hinatazaka46'
          - '22/7'
          - 'Boku ga Mitakatta Aozora'
          - 'Mai Shiraishi'
          - 'Nanase Nishino'
          - 'Erika Ikuta'
          - 'Asuka Saito'
          - 'Yurina Hirate'
          - 'Momoiro Clover Z'
          - 'Shiritsu Ebisu Chugaku'
          - 'Chou Tokimeki Sendenbu'
          - 'TEAM SHACHI'
          - 'BATTEN GIRLS'
          - 'ukka'
          - '=LOVE'
          - '≠ME'
          - '≒JOY'
          - 'FRUITS ZIPPER'
          - 'CANDY TUNE'
          - 'SWEET STEADY'
          - 'CUTIE STREET'
          - 'NiziU'
          - 'ME:I'
          - 'IS:SUE'
          - 'BABYMETAL'
          - 'Sakura Gakuin'
      page_depth:
        description: 'Pagination depth per query search (pages):'
        required: true
        default: '200'

concurrency:
  group: catalog-pipeline-lock
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scrape-targeted:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python with Pip Cache
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Cache Playwright Chromium Binaries
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-${{ hashFiles('requirements.txt') }}

      - name: Install Playwright Chromium with OS Dependencies (Cache Miss)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: |
          playwright install --with-deps chromium

      - name: Install Playwright OS Dependencies (Cache Hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: |
          playwright install-deps chromium

      - name: Step 1 - Execute Targeted CDJapan Scraper
        env:
          TARGET_ARTIST: ${{ github.event.inputs.target_artist }}
          PAGES_PER_TARGET: ${{ github.event.inputs.page_depth }}
        run: |
          python -u scraper.py

      - name: Step 2 - Re-align & Synchronize Catalog
        run: |
          python -u clean_catalog.py

      - name: Step 3 - Rebuild Catalog Summary Index
        run: |
          python build_catalog.py || python build_summary.py || true

      - name: Step 4 - Commit & Deploy Scraped Releases
        run: |
          git config --global user.name "IdolJapan Bot"
          git config --global user.email "bot@idoljapan.store"
          git add -A
          if ! git diff --staged --quiet; then
            git commit -m "Targeted scrape update [${{ github.event.inputs.target_artist }}]"
            git pull --rebase --autostash
            git push
          fi
