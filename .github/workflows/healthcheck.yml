name: Weekly CDJapan Catalog Healthcheck

on:
  schedule:
    # Runs every Sunday at 03:15 UTC
    - cron: '15 3 * * 0'
  workflow_dispatch:
    inputs:
      reset_history:
        description: 'Restart check from the beginning (clear history)?'
        required: false
        default: false
        type: boolean
      batch_size:
        description: 'Number of items to audit in this run:'
        required: false
        default: '500'
        type: string

permissions:
  contents: write

jobs:
  run-healthcheck:
    runs-on: ubuntu-latest
    env:
      PYTHONUNBUFFERED: "1"
      HEALTHCHECK_BATCH_SIZE: ${{ github.event.inputs.batch_size || '500' }}
      RESET_HEALTHCHECK: ${{ github.event.inputs.reset_history || 'false' }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Step 1 - Clean & Audit Catalog (Prune Non-Idols & Fix Categories)
        run: |
          python -u clean_catalog.py

      - name: Step 2 - Run URL & Availability Health Check
        run: |
          python -u healthcheck.py

      - name: Step 3 - Rebuild Catalog Summary Index
        run: |
          python build_catalog.py || python build_summary.py

      - name: Step 4 - Validate Catalog After Healthcheck
        run: |
          python validate_catalog.py

      - name: Step 5 - Auto-Generate XML Sitemap
        run: |
          python generate_sitemap.py

      - name: Step 6 - Commit and Push Healthcheck Updates
        run: |
          git config --global user.name "IdolJapan Bot"
          git config --global user.email "bot@idoljapan.store"
          git add products.json catalog-index.json sitemap.xml scraper_state.json pruned_items.txt
          git diff --quiet && git diff --staged --quiet || (git commit -m "Weekly healthcheck: purge invalid items, fix categories, and update OOP statuses" && git push)
