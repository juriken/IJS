name: Weekly Idol Product Sync

on:
  schedule:
    # Runs every Sunday at 00:00 JST (15:00 UTC)
    - cron: '0 15 * * 0'
  workflow_dispatch:

concurrency:
  group: catalog-pipeline-lock
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PYTHONUNBUFFERED: "1"
      DISCORD_RELEASE_WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python with Pip Cache
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Cache Playwright Chromium Binaries
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-${{ hashFiles('requirements.txt') }}

      - name: Install Playwright Chromium with OS Dependencies (Cache Miss)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: |
          playwright install --with-deps chromium

      - name: Install Playwright OS Dependencies (Cache Hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: |
          playwright install-deps chromium

      - name: Step 1 - Run Idol Catalog Scraper
        run: |
          python -u scraper.py

      - name: Step 2 - Clean Catalog & Enforce Member Reclassification
        run: |
          if [ -f clean_catalog.py ]; then
            python -u clean_catalog.py
          fi

      - name: Step 3 - Run Unified Build Pipeline
        run: |
          python build_catalog.py || python build_summary.py || true

      - name: Step 4 - Ping Search Engines for Rapid Indexing
        run: |
          if [ -f ping_search_engines.py ]; then
            python ping_search_engines.py
          fi

      - name: Step 5 - Broadcast New Releases to Community Webhook
        run: |
          if [ -f notify_releases.py ]; then
            python notify_releases.py
          fi

      - name: Step 6 - Commit and Push Updated Catalog & Sitemap
        run: |
          git config --global user.name "IdolJapan Bot"
          git config --global user.email "bot@idoljapan.store"
          git add -A
          if ! git diff --staged --quiet; then
            git commit -m "Weekly idol catalog, landing pages & sitemap update"
            git pull --rebase --autostash
            git push
          fi
