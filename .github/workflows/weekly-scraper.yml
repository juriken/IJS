name: Weekly Idol Product Sync

on:
  schedule:
    # Runs every Sunday at 00:00 JST (15:00 UTC)
    - cron: '0 15 * * 0'
  workflow_dispatch:

concurrency:
  group: catalog-pipeline-lock
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    env:
      PYTHONUNBUFFERED: "1"
      DISCORD_RELEASE_WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 playwright

      - name: Install Playwright Chromium with OS Dependencies
        run: |
          playwright install --with-deps chromium

      - name: Run Idol Catalog Scraper
        run: |
          python -u scraper.py

      - name: Run Unified Build Pipeline
        run: |
          python build_catalog.py

      - name: Ping Search Engines for Rapid Indexing
        run: |
          python ping_search_engines.py

      - name: Broadcast New Releases to Community Webhook
        run: |
          python notify_releases.py

      - name: Commit and Push Updated Catalog & Sitemap
        run: |
          git config --global user.name "IdolJapan Bot"
          git config --global user.email "bot@idoljapan.store"
          git add -A
          if ! git diff --staged --quiet; then
            git commit -m "Auto-update idol catalog, landing pages & sitemap"
            git pull --rebase --autostash
            git push
          fi
