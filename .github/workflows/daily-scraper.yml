name: Daily Idol Product Sync

on:
  schedule:
    # Runs automatically every day at 03:00 UTC
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-and-update:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Scraping Tools & Playwright Chrome
        run: |
          python -m pip install --upgrade pip
          pip install beautifulsoup4 playwright
          playwright install --with-deps chromium

      - name: Run Scraper
        run: |
          python fix_catalog_dates.py

      - name: Commit and Push Updated Catalog
        run: |
          git config --global user.name "IdolJapan Bot"
          git config --global user.email "bot@idoljapan.store"
          git add products.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update idol catalog" && git push)
