  workflow_dispatch:
    inputs:
      target_artist:
        description: 'Choose group/soloist to deep scrape:'
        required: true
        default: 'All Groups'
        type: choice
        options:
          - 'All Groups'
          - 'Morning Musume'
          - 'ANGERME'
