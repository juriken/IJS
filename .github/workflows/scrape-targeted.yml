          - 'Hello Pro Kenshuusei'
          - 'Minimoni'
          - 'Berryz Kobo'
          - '℃-ute'
          - 'Buono!'
          - 'Country Girls'
          - 'Kobushi Factory'
          - 'Melon Kinenbi'
          - 'Tanpopo'
          - 'v-u-den'
          - 'W'
          - 'GAM'
          - 'Taiyo to Ciscomoon'
          - 'LoVendoR'
          - 'PINK CRES.'
          - 'Sayumi Michishige'
          - 'Aya Matsuura'
          - 'Maki Goto'
          - 'Natsumi Abe'
          - 'Erina Mano'
          - 'Airi Suzuki'
          - 'Miki Fujimoto'
          - 'Tsukishima Kirari'
          - 'Karin Miyamoto'
          - 'You Kikkawa'
          - 'Up Up Girls (Kari)'
          - 'Up Up Girls (2)'
          - 'AKB48'
          - 'SKE48'
          - 'NMB48'
          - 'HKT48'
          - 'NGT48'
          - 'STU48'
          - 'Not yet'
          - 'no3b'
          - 'French Kiss'
          - 'Watarirouka Hashiritai'
          - 'Sayaka Yamamoto'
          - 'Atsuko Maeda'
          - 'Yuko Oshima'
          - 'Mayu Watanabe'
          - 'Yuki Kashiwagi'
          - 'Rino Sashihara'
          - 'Tomomi Itano'
          - 'Nogizaka46'
          - 'Sakurazaka46'
          - 'Hinatazaka46'
          - '22/7'
          - 'Boku ga Mitakatta Aozora'
          - 'Mai Shiraishi'
          - 'Nanase Nishino'
          - 'Erika Ikuta'
          - 'Asuka Saito'
          - 'Yurina Hirate'
          - 'Momoiro Clover Z'
          - 'Shiritsu Ebisu Chugaku'
          - 'Chou Tokimeki Sendenbu'
          - 'TEAM SHACHI'
          - 'BATTEN GIRLS'
          - 'ukka'
          - '=LOVE'
          - '≠ME'
          - '≒JOY'
          - 'FRUITS ZIPPER'
          - 'CANDY TUNE'
          - 'SWEET STEADY'
          - 'CUTIE STREET'
          - 'NiziU'
          - 'ME:I'
          - 'IS:SUE'
          - 'BABYMETAL'
          - 'Sakura Gakuin'
      page_depth:
        description: 'Pagination depth per query search (pages):'
        required: true
        default: '100'

jobs:
  scrape-targeted:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies for Playwright
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxrandr2 libgbm1 libasound2 libpango-1.0-0 libpangocairo-1.0-0

      - name: Install Python Libraries & Browsers
        run: |
          pip install playwright beautifulsoup4 requests
          playwright install chromium

      - name: Execute Targeted CDJapan Scraper
        env:
          TARGET_ARTIST: ${{ github.event.inputs.target_artist }}
          PAGES_PER_TARGET: ${{ github.event.inputs.page_depth }}
        run: |
          python -u scraper.py

      - name: Re-align & Synchronize Catalog
        run: |
          python -u clean_catalog.py

      - name: Commit & Deploy Synchronized Catalog
        run: |
          git config --global user.name "IdolJapan Auto Bot"
          git config --global user.email "bot@idoljapan.store"
          git add products.json catalog-index.json scraper_state.json pruned_items.txt search_aliases.json
          git diff --staged --quiet || git commit -m "Targeted scrape & classification sync [${{ github.event.inputs.target_artist }}]"
          git push
