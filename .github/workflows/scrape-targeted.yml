          - 'GAM'
          - 'Taiyo to Ciscomoon'
          - 'LoVendoR'
          - 'PINK CRES.'
          - 'Sayumi Michishige'
          - 'Aya Matsuura'
          - 'Maki Goto'
          - 'Natsumi Abe'
          - 'Erina Mano'
          - 'Airi Suzuki'
          - 'Miki Fujimoto'
          - 'Tsukishima Kirari'
          - 'Karin Miyamoto'
          - 'You Kikkawa'
          - 'Up Up Girls (Kari)'
          - 'Up Up Girls (2)'
          - 'AKB48'
